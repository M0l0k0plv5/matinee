<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Matinee Remote: a phone's remote for the Matinees of a Jellyfin account, through Jellyfin's remote control (Matinee takes
     its commands as the remote's keys: remote_command in backend/live_events.py). A page of its own, no dependencies;
     it talks to Jellyfin only. remote/README.md says how to put it on a server. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http:; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- the page's version, the same in app.js: raised together when one needs the other's new parts -->
<meta name="kino-remote-version" content="5">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matinee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Matinee Remote</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  /* Matinee's own colors, as on the TV (web/tokens.css): a warm dark, a projector's white, the sage of the focus */
  --surface: #1e1b19;
  --surface-2: #2c2825;
  --surface-3: #3b3632;
  --text: #f6f1ea;
  --text-2: rgba(246, 241, 234, 0.62);
  --text-3: rgba(246, 241, 234, 0.32);
  --text-hint: rgba(246, 241, 234, 0.5); /* placeholders: 4.5:1 on a field, where --text-3 is under 3:1 */
  --accent: #8fbcb2;
  --accent-ink: #0c1715;         /* text on the sage */
  --danger: #ff6b5e;          /* Matinee's red for text on black (--live-ink) */
  --radius: 14px;
  --font: system-ui, "Inter", "Segoe UI", Roboto, sans-serif; /* the phone's own */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 17px/1.35 var(--font); }
body {
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-user-select: none; user-select: none; overscroll-behavior: none;
}
main { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
main > section { display: flex; flex-direction: column; gap: 16px; flex: 1; }
[hidden] { display: none !important; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 24px 0 4px; }
p.note { color: var(--text-2); margin: 0; font-size: 15px; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input {
  font: inherit; color: var(--text); background: var(--surface); border: 0; border-radius: var(--radius);
  padding: 14px 16px; width: 100%; outline: none; -webkit-user-select: text; user-select: text;
}
input::placeholder { color: var(--text-hint); }
input:focus { box-shadow: 0 0 0 2px var(--accent); }
.primary {
  background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: var(--radius); padding: 14px; width: 100%;
}
.primary:disabled { opacity: 0.5; }
.link { color: var(--accent); font-size: 15px; padding: 8px 0; min-height: 44px; } /* a finger's reach, as every other button */
.error { color: var(--danger); font-size: 15px; min-height: 20px; margin: 0; }
form { display: flex; flex-direction: column; gap: 12px; margin: 0; }

/* the Matinees to choose from */
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; width: 100%; }
.row + .row { border-top: 0.5px solid var(--surface-3); }
.row:active { background: var(--surface-2); }
.row .name { font-weight: 600; }
.row .sub { color: var(--text-2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .texts { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .check { color: var(--accent); font-weight: 600; }
.empty { color: var(--text-2); text-align: center; padding: 32px 16px; margin: 0; }
.empty .note { margin-top: 8px; }
.empty-title { margin: 0; color: var(--text); }

/* the remote */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.device { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 17px; min-width: 0; }
.device span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.device svg { flex: none; opacity: 0.6; }
.who { display: flex; flex-direction: column; min-width: 0; }
.status { color: var(--text-2); font-size: 13px; }
.status.off { color: var(--danger); }
.now { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.now .head { display: flex; align-items: center; gap: 12px; }
.now .cover { flex: none; width: 40px; height: 60px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
.now .texts { flex: 1; min-width: 0; }
.now .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .what { color: var(--text-2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seekrow { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.seekrow input { flex: 1; min-width: 0; }
.transport { display: flex; justify-content: space-between; }
.transport button { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.transport button:active, .transport button.pressed { background: var(--surface-3); }
.transport svg { width: 24px; height: 24px; }
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; padding: 20px 0; margin: -10px 0; box-shadow: none; } /* 44 px to touch, laid out as 24 */
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--text) var(--p, 0%), var(--surface-3) var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--text); margin-top: -9px; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--surface-3); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--text); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--text); }
.tracks { display: flex; gap: 8px; }
.chip { position: relative; background: var(--surface-2); border-radius: 999px; padding: 7px 14px; font-size: 15px; }
.chip::after { content: ""; position: absolute; inset: -5px -2px; } /* touched within 44 px, drawn smaller */
.chip:active { background: var(--surface-3); }

.pad {
  position: relative; width: 100%; flex: 1 1 0; min-height: 200px; max-height: min(46vh, 440px); border-radius: 28px;
  background: radial-gradient(circle at 50% 50%, var(--surface-2), var(--surface) 70%); touch-action: none; overflow: hidden;
}
.pad .dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--text-3); }
.pad .arrow { position: absolute; color: var(--text-3); pointer-events: none; }
.pad .arrow.up { top: 14px; left: 50%; transform: translateX(-50%); }
.pad .arrow.down { bottom: 14px; left: 50%; transform: translateX(-50%) rotate(180deg); }
.pad .arrow.left { left: 14px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
.pad .arrow.right { right: 14px; top: 50%; transform: translateY(-50%) rotate(90deg); }
.pad .flash { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
.pad .flash.on { opacity: 1; transition: none; }

.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.key {
  height: 56px; border-radius: 999px; background: var(--surface); display: flex; align-items: center; justify-content: center;
  gap: 6px; font-size: 15px; color: var(--text);
}
.key:active, .key.pressed { background: var(--surface-3); }
.key svg { width: 24px; height: 24px; }
/* play/pause shows what a press does: both signs while nothing plays */
.pp .i-play, .pp .i-pause { display: none; }
.pp[data-state=playing] .i-pause, .pp[data-state=paused] .i-play { display: block; }
.pp[data-state=playing] .i-both, .pp[data-state=paused] .i-both { display: none; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; }

/* the library: shelves of covers to swipe through */
#library { padding-bottom: 84px; }
#library h1 { margin: 0; }
/* what plays, under the library: a tap opens the remote */
.mini {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
  width: min(calc(100% - 32px), 440px); display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 10px;
  background: var(--surface-2); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
}
.mini .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
.mini img { flex: none; width: 32px; height: 48px; border-radius: 5px; object-fit: cover; background: var(--surface-3); }
.mini .texts { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mini .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .what { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .pp { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.mini .pp:active { background: var(--surface-3); }
.mini .pp svg { width: 24px; height: 24px; }
#shelves { display: flex; flex-direction: column; gap: 24px; }
.shelf h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
.strip {
  display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scroll-padding: 0 16px;
  scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
.strip::-webkit-scrollbar { display: none; }
.card { flex: none; width: 112px; text-align: left; scroll-snap-align: start; }
.card .art { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 10px; background: var(--surface); overflow: hidden; }
.card.square .art { aspect-ratio: 1; }
.card:active .art { opacity: 0.7; }
.card img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card .bar { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
.card .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.card .name, .card .sub { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .name { margin-top: 6px; }
.card .sub { color: var(--text-2); }

/* a sheet of choices: the audio, the subtitles */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet {
  width: 100%; max-width: 472px; max-height: 70vh; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 8px 0 max(16px, env(safe-area-inset-bottom));
}
.sheet h2 { font-size: 15px; font-weight: 600; color: var(--text-2); margin: 8px 16px 4px; text-transform: none; }
.sheet .list { border-radius: 0; background: none; }

.toast {
  position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--surface-2); color: var(--text); padding: 10px 16px; border-radius: 999px; font-size: 15px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); z-index: 20; max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: reduce) { .pad .flash { transition: none; } }
</style>
</head>
<body>
<main>
  <!-- signing in to Jellyfin -->
  <section id="login" hidden>
    <h1 data-t="signIn"></h1>
    <p class="note" data-t="signInNote"></p>
    <form id="loginForm" autocomplete="on">
      <input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <input id="user" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <input id="password" type="password" autocomplete="current-password">
      <p class="error" id="loginError" role="alert"></p>
      <button class="primary" id="loginButton" type="submit" data-t="signInButton"></button>
    </form>
  </section>

  <!-- the Matinees of the account that are on -->
  <section id="devices" hidden>
    <h1 data-t="devices"></h1>
    <div class="list" id="deviceList"></div>
    <div class="empty" id="noDevices" hidden role="status"><p id="noDevicesText" class="empty-title"></p><p class="note" id="noDevicesHint"></p></div>
    <button class="link" id="signOut" data-t="signOut"></button>
  </section>

  <!-- the remote -->
  <section id="remote" hidden>
    <div class="top">
      <div class="who">
        <button class="device" id="deviceButton" aria-haspopup="true">
          <span id="deviceName"></span>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="status" id="status"></span>
      </div>
      <button class="chip" id="libraryButton" data-t="library"></button>
    </div>

    <div class="now" id="now" hidden>
      <div class="head">
        <img class="cover" id="nowCover" alt="" hidden>
        <div class="texts">
          <div class="title" id="nowTitle"></div>
          <div class="what" id="nowWhat"></div>
        </div>
      </div>
      <div class="seekrow">
        <span id="elapsed"></span>
        <input type="range" id="seek" min="0" max="1" step="1" value="0" aria-labelledby="nowTitle">
        <span id="remaining"></span>
      </div>
      <div class="transport">
        <button data-play="PreviousTrack" data-t-label="previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6v12l-9-6z" fill="currentColor"/><path d="M6 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button data-play="Rewind" data-repeat data-t-label="rewind">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12l-9-6zM21 6v12l-9-6z" fill="currentColor"/></svg>
        </button>
        <button data-play="Stop" data-t-label="stop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
        <button data-play="FastForward" data-repeat data-t-label="forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12l9-6zM3 6v12l9-6z" fill="currentColor"/></svg>
        </button>
        <button data-play="NextTrack" data-t-label="next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6v12l9-6z" fill="currentColor"/><path d="M18 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="tracks" id="tracks" hidden>
        <button class="chip" id="audioButton" data-t="audio"></button>
        <button class="chip" id="subsButton" data-t="subtitles"></button>
      </div>
    </div>

    <div class="pad" id="pad" role="application" data-t-label="padLabel">
      <svg class="arrow up" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 10l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arrow down" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 10l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arrow left" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 10l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="arrow right" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 10l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="dot"></div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="keys">
      <button class="key" data-cmd="Back" data-t-label="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="key" data-cmd="GoHome" data-t-label="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button class="key" data-cmd="ToggleContextMenu" data-t-label="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="key" data-cmd="VolumeDown" data-repeat data-t-label="quieter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 12h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="key pp" id="playPause" data-play="PlayPause" data-t-label="playPause">
        <svg class="i-both" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5v13l8-6.5z" fill="currentColor"/><path d="M14 5v14M19 5v14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <button class="key" data-cmd="VolumeUp" data-repeat data-t-label="louder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 12h5M18.5 9.5v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form class="search" id="searchForm">
      <input id="text" type="search" enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false">
    </form>
  </section>

  <!-- the library: what to go on with, the films and shows, as covers; a tap plays one on the Matinee -->
  <section id="library" hidden>
    <div class="top">
      <h1 data-t="library"></h1>
      <button class="chip" id="libraryBack" data-t="remote"></button>
    </div>
    <div id="shelves"></div>
    <p class="empty" id="libraryEmpty" hidden></p>
    <div class="mini" id="mini" hidden>
      <button class="open" id="miniOpen">
        <img id="miniCover" alt="" hidden>
        <span class="texts"><span class="title" id="miniTitle"></span><span class="what" id="miniWhat"></span></span>
      </button>
      <button class="pp" id="miniPlay" data-play="PlayPause" data-t-label="playPause">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </section>
</main>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div class="list" id="sheetList"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js?v=5"></script>
</body>
</html>
