# mpv settings for Matinee only (loaded via --config-dir, your normal mpv config is left alone).
# Preferred audio/subtitle languages are passed by the backend according to the system language.
fullscreen=yes
keep-open=yes                 # stay on the last frame so Matinee can load the next episode in the same window
hwdec=auto-safe               # hardware decoding, important on weak thin clients
video-sync=display-resample   # every frame equally long when the refresh rate is almost a multiple (23.976 at 120 Hz)
vo=gpu-next,gpu                # gpu where gpu-next finds no OpenGL or Vulkan it can use (seen in a VM without a GPU)
cursor-autohide=1000          # the pointer only while a mouse moves (kino.lua: a click, the wheel)
input-default-bindings=no     # only the keys from input.conf, so no remote key does anything unexpected

subs-with-matching-audio=forced   # in the language of the audio only forced subtitles (the backend sets it per film)
sub-auto=fuzzy

# Look of the overlays: no mpv controls (kino.lua draws its own bar at the bottom); messages (skip the intro, the
# volume, the sleep timer) in a dark box at the bottom right, above that bar
osc=no
osd-font="Allo"                # the player's own texts in Matinee's font (web/fonts, given by the backend)
osd-font-size=34
osd-bar=no
osd-duration=1500
osd-align-x=right
osd-align-y=bottom
osd-margin-x=86
osd-margin-y=200
osd-border-style=background-box
osd-back-color="#D01C1C22"     # Matinee's dark glass, nearly opaque (#AARRGGBB)
osd-outline-size=14            # with the box: the room around the text
osd-outline-color="#00000000"  # and no outline drawn around the letters
osd-shadow-offset=0
sub-font="Inter"
sub-font-size=46
sub-border-size=2.5
sub-shadow-offset=1.5

volume-max=150
