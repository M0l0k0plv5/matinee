# The menus of the audio tracks, subtitles and chapters (mpv's console, Up/Down/TOOLS in input.conf) in Matinee's
# look: larger, rounder, the focused line white with dark text, as in Matinee's pages
font_size=28
padding=16
gap=0.4
corner_radius=18
border_size=0
menu_outline_size=0
background_alpha=48
focused_color=#000000
focused_back_color=#FFFFFF
match_color=#2997FF
