# Key bindings for remotes (arrows, OK, back, media keys) and keyboards.
# Up and down = louder and quieter at once, held on and on (kino.lua); on a channel live the channels instead.
# Menu = the info panel (info, chapters, audio, subtitles, speed), arrows and OK in it; on a channel live the volume,
# then up and down make it louder and quieter for a moment.
# Each key also sends kino-active: someone is watching, so the backend does not ask "Still watching?".

# Left and right (10 s), the media keys (30 s), page up and down (10 min) move a mark along the bar; the playback
# goes there a moment after the last press, or when paused with OK (kino.lua)
LEFT        script-binding kino/seek-left
RIGHT       script-binding kino/seek-right
KP_LEFT     script-binding kino/seek-left
KP_RIGHT    script-binding kino/seek-right
REWIND      script-binding kino/seek-rewind
FORWARD     script-binding kino/seek-forward
PGUP        script-binding kino/seek-ahead10
PGDWN       script-binding kino/seek-back10

# louder and quieter; on a channel live the next channel and the one before (kino.lua), like a TV's channel keys
UP          script-binding kino/up
DOWN        script-binding kino/down
CHANNEL_UP  script-message kino-zap-next ; script-message kino-active
CHANNEL_DOWN script-message kino-zap-prev ; script-message kino-active
MENU        script-binding kino/menu
TAB         script-binding kino/menu
TOOLS       script-binding kino/chapters
c           script-binding kino/chapters

# OK skips intro/recap, jumps to the next episode during the credits, and pauses otherwise
ENTER       script-binding kino/ok
KP_ENTER    script-binding kino/ok
SPACE       cycle pause ; script-message kino-show ; script-message kino-active
PLAYPAUSE   script-binding kino/play
PLAY        script-binding kino/play
PAUSE       set pause yes ; script-message kino-active
PLAYONLY    set pause no ; script-message kino-active
PAUSEONLY   set pause yes ; script-message kino-active
XF86_PAUSE  cycle pause ; script-message kino-active

# Back closes an open menu, otherwise playback ends; progress is reported to Jellyfin
ESC         script-binding kino/back
BS          script-binding kino/back
GO_BACK     script-binding kino/back
MBTN_BACK   script-binding kino/back
STOP        script-message kino-quit ; script-message kino-active
XF86_STOP   script-message kino-quit ; script-message kino-active
CANCEL      script-binding kino/back
q           script-message kino-quit ; script-message kino-active
CLOSE_WIN   script-message kino-quit ; script-message kino-active

# Next episode right away
NEXT        script-message kino-next ; script-message kino-active
s           script-message kino-sleep ; script-message kino-active
SLEEP       script-message kino-sleep ; script-message kino-active
XF86_NEXT   script-message kino-next ; script-message kino-active
PREV        script-binding kino/seek-rewind
XF86_PREV   script-binding kino/seek-rewind
n           script-message kino-next ; script-message kino-active

# A mouse or trackpad (kino.lua): a click pauses and plays (on the bar's line it goes there), a double click switches
# full screen, a right click opens the info panel; the wheel is louder and quieter, sideways it seeks
MBTN_LEFT     script-binding kino/click
MBTN_LEFT_DBL script-binding kino/dblclick
MBTN_RIGHT    script-binding kino/menu
WHEEL_UP      script-binding kino/wheel-up
WHEEL_DOWN    script-binding kino/wheel-down
WHEEL_LEFT    script-binding kino/wheel-left
WHEEL_RIGHT   script-binding kino/wheel-right

VOLUME_UP   script-message kino-volume 5 ; script-message kino-active
VOLUME_DOWN script-message kino-volume -5 ; script-message kino-active
MUTE        cycle mute ; script-message kino-active
m           cycle mute ; script-message kino-active
i           script-binding stats/display-stats-toggle ; script-message kino-active
