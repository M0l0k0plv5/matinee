# Matinee: Bluetooth speakers and headphones only in A2DP, their full stereo sound. Never the telephone profile
# (HSP/HFP: mono, 16 kHz), which a speaker with a microphone for calls falls to when something asks for its
# microphone; a TV has no use for one. Put in ~/.config/wireplumber/wireplumber.conf.d/ by Matinee (bt_stereo_only).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
